services:
  whatsapp-hybrid-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-hybrid-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HEALTH_CHECK_PORT:-8080}:8080"
    volumes:
      - ./sessions:/app/sessions
      - ./temp_storage:/app/temp_storage
      - ./logs:/app/logs
      - ./config/accounts.json:/app/config/accounts.json:ro
